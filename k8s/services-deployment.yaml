# node-service and python-service - deployed for convenience/demo purposes only.
# These are NOT part of the measured autoscaling experiment (see Chapter 3,
# Section 3.4.2 scoping decision). Scale to zero or delete before any measured
# HPA/PHPA run, so they don't consume cluster CPU/memory headroom during data
# collection.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-service
  namespace: phpa-experiment
  labels:
    app: node-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-service
  template:
    metadata:
      labels:
        app: node-service
    spec:
      containers:
        - name: node-service
          image: node-service:test
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: node-service
  namespace: phpa-experiment
spec:
  selector:
    app: node-service
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: phpa-experiment
  labels:
    app: python-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-service
  template:
    metadata:
      labels:
        app: python-service
    spec:
      containers:
        - name: python-service
          image: python-service:test
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: GO_SERVICE_URL
              value: "http://go-service:8000"
            - name: NODE_SERVICE_URL
              value: "http://node-service:3000"
            - name: REDIS_URL
              value: "redis:6379"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: phpa-experiment
spec:
  selector:
    app: python-service
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP